name: "Commit"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck all shell scripts and tests
        run: |
          shellcheck \
            scripts/linux/relocate.sh scripts/mac/relocate.sh \
            scripts/linux/checksums.sh \
            scripts/linux/verify.sh scripts/mac/verify.sh \
            tests/relocate_test.sh tests/checksum_test.sh

      - name: Run unit tests
        run: |
          bash tests/relocate_test.sh
          bash tests/checksum_test.sh

  # Exercise the action across a wide variety of Linux distros and both
  # architectures, inside distro containers. Each leg installs a toolchain,
  # runs the action, verifies a process is actually using jemalloc, then runs
  # the action a SECOND time (the #5 regression) and asserts the first
  # invocation's preloaded process survives. The required checks `linux` and
  # `linux_double_invocation` are aggregation gates over this matrix (below).
  distro_matrix:
    name: "${{ matrix.image }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- x64 ----
          - { image: "ubuntu:22.04",     arch: x64,   runner: ubuntu-24.04,     pm: apt }
          - { image: "ubuntu:24.04",     arch: x64,   runner: ubuntu-24.04,     pm: apt }
          - { image: "debian:12",        arch: x64,   runner: ubuntu-24.04,     pm: apt }
          - { image: "alpine:3.20",      arch: x64,   runner: ubuntu-24.04,     pm: apk }
          - { image: "fedora:40",        arch: x64,   runner: ubuntu-24.04,     pm: dnf }
          - { image: "rockylinux:9",     arch: x64,   runner: ubuntu-24.04,     pm: dnf }
          - { image: "archlinux:latest", arch: x64,   runner: ubuntu-24.04,     pm: pacman }
          - { image: "opensuse/leap:15", arch: x64,   runner: ubuntu-24.04,     pm: zypper }
          # ---- arm64 ----
          # Notes: no official arm64 archlinux image (Arch is x64-only); and
          # GitHub only supports JS actions in Alpine containers on x64, so
          # Alpine arm64 is not runnable here (musl is still covered by x64).
          - { image: "ubuntu:22.04",     arch: arm64, runner: ubuntu-24.04-arm, pm: apt }
          - { image: "ubuntu:24.04",     arch: arm64, runner: ubuntu-24.04-arm, pm: apt }
          - { image: "debian:12",        arch: arm64, runner: ubuntu-24.04-arm, pm: apt }
          - { image: "fedora:40",        arch: arm64, runner: ubuntu-24.04-arm, pm: dnf }
          - { image: "rockylinux:9",     arch: arm64, runner: ubuntu-24.04-arm, pm: dnf }
          - { image: "opensuse/leap:15", arch: arm64, runner: ubuntu-24.04-arm, pm: zypper }
    steps:
      # Install the toolchain the action needs to build jemalloc, plus the
      # tools its steps and CI use (curl, bzip2, tar, lsof, git, ...). Runs in
      # `sh` because minimal images (Alpine) have no bash until we install it.
      # Alpine also needs gcompat + libstdc++ so GitHub's glibc-built node can
      # run the JS actions (checkout / cache) on musl.
      - name: Install build dependencies
        shell: sh
        run: |
          set -e
          case "${{ matrix.pm }}" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y gcc make curl bzip2 tar ca-certificates zstd git
              ;;
            apk)
              apk add --no-cache build-base curl bzip2 tar ca-certificates zstd git bash gcompat libstdc++
              ;;
            dnf)
              # --allowerasing lets `curl` replace the `curl-minimal` that
              # RHEL-family minimal images ship (otherwise a package conflict).
              dnf install -y --allowerasing gcc make curl bzip2 tar ca-certificates zstd git
              ;;
            pacman)
              pacman -Sy --noconfirm --needed gcc make curl bzip2 tar ca-certificates zstd git
              ;;
            zypper)
              # Leap images sometimes ship a broken/unreachable backports repo
              # that aborts the install refresh; drop it and import keys.
              zypper --non-interactive removerepo repo-backports-update >/dev/null 2>&1 || true
              zypper --non-interactive removerepo repo-openh264 >/dev/null 2>&1 || true
              zypper --non-interactive --gpg-auto-import-keys install gcc make curl bzip2 tar zstd git
              ;;
          esac

      - uses: actions/checkout@v7

      - name: Run jemalloc action (1st invocation)
        id: jemalloc
        uses: ./

      - name: Verify outputs + jemalloc preloaded
        shell: bash
        run: |
          echo "cache-hit=${{ steps.jemalloc.outputs.cache-hit }}"
          echo "library-path=${{ steps.jemalloc.outputs.library-path }}"
          test "${{ steps.jemalloc.outputs.library-path }}" = "/usr/local/lib/libjemalloc.so.2"
          test "${{ steps.jemalloc.outputs.ld-preload }}" = "/usr/local/lib/libjemalloc.so.2"
          case "${{ steps.jemalloc.outputs.cache-hit }}" in true|false) ;; *) echo "bad cache-hit" >&2; exit 1 ;; esac
          echo "LD_PRELOAD=$LD_PRELOAD"
          # Dependency-free, long-lived workload (sleep is always present and
          # dynamically linked, so jemalloc still maps into it).
          sleep 600 &
          echo $! > pid1
          sleep 2
          ./scripts/linux/verify.sh "$(cat pid1)"

      - name: Run jemalloc action (2nd invocation - #5 regression)
        uses: ./

      - name: Assert 1st-invocation process survived the relocate
        shell: bash
        run: |
          if ! kill -0 "$(cat pid1)" 2>/dev/null; then
            echo "::error::pid1 (jemalloc-preloaded) died across the 2nd invocation - regression of #5 on ${{ matrix.image }} (${{ matrix.arch }})"
            exit 1
          fi
          ./scripts/linux/verify.sh "$(cat pid1)"

      - name: Cleanup
        if: always()
        run: |
          [ -f pid1 ] && { kill "$(cat pid1)" 2>/dev/null || true; rm -f pid1; } || true

  # Required status check: green only if every distro/arch leg passed.
  # NOTE: `linux` and `linux_double_invocation` are intentionally identical gate
  # jobs (the branch ruleset requires both check names, which a matrix leg can't
  # satisfy). Keep their gate scripts in sync.
  linux:
    needs: distro_matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the distro matrix
        run: |
          echo "distro_matrix result: ${{ needs.distro_matrix.result }}"
          [ "${{ needs.distro_matrix.result }}" = "success" ] || { echo "one or more distro/arch legs failed"; exit 1; }

  # Required status check: the #5 second-invocation regression is exercised on
  # every leg of the distro matrix, so this gate mirrors it.
  linux_double_invocation:
    needs: distro_matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the distro matrix (second-invocation covered per leg)
        run: |
          echo "distro_matrix result: ${{ needs.distro_matrix.result }}"
          [ "${{ needs.distro_matrix.result }}" = "success" ] || { echo "one or more distro/arch legs failed"; exit 1; }
