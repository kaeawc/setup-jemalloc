name: "Darling (experimental Darwin path)"

# Experimental (issue #34): exercise setup-jemalloc's Darwin code path on a
# Linux runner via Darling. Darling has no prebuilt packages, so this builds it
# from source (heavy) — hence it is opt-in via pull_request while iterating and
# will move to workflow_dispatch-only before merge. NOT part of the commit gate.
on:
  pull_request:
  workflow_dispatch:

jobs:
  darling:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Free up disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Darling build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake automake bison flex libfuse-dev libudev-dev pkg-config \
            libc6-dev-i386 gcc-multilib libcairo2-dev libgl1-mesa-dev curl \
            libglu1-mesa-dev libtiff-dev libfreetype-dev git git-lfs libelf-dev \
            libxml2-dev libegl1-mesa-dev libfontconfig1-dev libbsd-dev \
            libxrandr-dev libxcursor-dev libgif-dev libavutil-dev libpulse-dev \
            libavformat-dev libavcodec-dev libswresample-dev libdbus-1-dev \
            libxkbfile-dev libssl-dev libstdc++-12-dev
          # Prefer a specific clang if available; fall back to the default.
          sudo apt-get install -y clang-15 || sudo apt-get install -y clang || true
          clang --version || clang-15 --version || true

      - name: Clone Darling
        run: |
          set -euxo pipefail
          git clone --depth 1 --recursive https://github.com/darlinghq/darling.git
          du -sh darling || true

      - name: Build & install Darling
        id: build
        run: |
          set -euxo pipefail
          cd darling
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          sudo make install
          df -h /

      - name: "Smoke: Darwin userland (sw_vers, uname)"
        id: smoke
        run: |
          set -uxo pipefail
          darling shell sw_vers || true
          darling shell uname -a || true
          darling shell "echo hello from Darwin && bash --version | head -1" || true

      # ---- Best-effort Darwin code-path checks (do not fail the job) ----
      - name: "Darwin path: run scripts/mac helpers under Darling"
        continue-on-error: true
        working-directory: repo
        run: |
          set -uxo pipefail
          darling shell "bash scripts/mac/verify.sh 99999 || echo verify.sh-exit-\$?"
          darling shell "bash -n scripts/mac/relocate.sh && echo 'relocate.sh parses under Darwin bash'"

      - name: "Darwin path: build jemalloc with Darling clang"
        continue-on-error: true
        working-directory: repo
        run: |
          set -uxo pipefail
          curl -fLo jemalloc.tar.bz2 https://github.com/jemalloc/jemalloc/releases/download/5.3.0/jemalloc-5.3.0.tar.bz2
          tar xf jemalloc.tar.bz2
          cd jemalloc-5.3.0
          darling shell "./configure --disable-cxx && make -j2 && ls -la lib/ && file lib/libjemalloc.*.dylib" \
            || echo 'jemalloc Darwin build under Darling did not complete'

      - name: "Attempt xcodebuild (expected: unavailable)"
        continue-on-error: true
        run: |
          set -uxo pipefail
          echo 'xcodebuild is expected to be UNAVAILABLE (Darling ships no Xcode/SDK).'
          darling shell "xcode-select -p || true"
          darling shell "xcodebuild -version" || echo 'as expected: xcodebuild is not available under Darling'
