name: Darling

on:
  workflow_dispatch:
  push:
    branches: ['*']

permissions:
  contents: read

# Experimental (issue #34): exercise setup-jemalloc's macOS/Darwin path on a
# Linux runner using Darling (https://darlinghq.org), a macOS translation layer.
# There is no Xcode project here — the "macOS build" is jemalloc's Darwin
# ./configure && make plus the dyld interposer — so Darling's job is to build
# and run those Mach-O artifacts on Linux. Install pinned prebuilt debs (no
# from-source build, no kernel module: Darling is userspace-only since 2022).
# The debs target Ubuntu 24.04 (noble) amd64; keep the runner pinned to match.
jobs:
  darling-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true   # experimental: never blocks; results in the summary
    env:
      DARLING_DEBS_URL: https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip
      DARLING_DEBS_SHA256: 27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd
    steps:
      - uses: actions/checkout@v4

      - name: Install Darling (pinned prebuilt debs)
        run: |
          curl -fsSL --retry 3 -o /tmp/darling-debs.zip "$DARLING_DEBS_URL"
          echo "$DARLING_DEBS_SHA256  /tmp/darling-debs.zip" | sha256sum -c -
          unzip -q /tmp/darling-debs.zip -d /tmp/darling-debs
          sudo apt-get update
          # Minimal CLI dependency closure (the full metapackage drags in GUI,
          # Python 2, Ruby, Perl components we don't need).
          sudo apt-get install -y \
            /tmp/darling-debs/debs_*/darling-core_*.deb \
            /tmp/darling-debs/debs_*/darling-system_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-gui-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-python2-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli_*.deb

      - name: Exercise the Darwin path under Darling
        run: ./scripts/darling-ci.sh
