# action.yml
name: "setup-jemalloc"
description: "An action to download, install, and cache jemalloc on Linux runners (macOS and Windows are currently unsupported)"
author: "Jason Pearson"
inputs:
  jemalloc-version:
    description: "Version of jemalloc to use"
    # Not required: it has a default, so callers may omit it.
    required: false
    default: "5.3.0"
  jemalloc-sha256:
    description: "Optional SHA-256 of the jemalloc tarball. Overrides the built-in checksum and lets you pin a version that has no baked-in value. When empty and the version is unknown, the integrity check is skipped with a warning."
    required: false
    default: ""
outputs:
  cache-hit:
    description: "Whether the jemalloc library was restored from cache ('true'/'false'; empty on non-Linux runners)."
    value: ${{ steps.config.outputs.cache-hit }}
  library-path:
    description: "Absolute path to the installed libjemalloc.so.2 (empty on non-Linux runners)."
    value: ${{ steps.config.outputs.library-path }}
  ld-preload:
    description: "The LD_PRELOAD value the action set (empty on non-Linux runners)."
    value: ${{ steps.config.outputs.ld-preload }}

# Every step is gated on runner.os == 'Linux', so the action is a graceful
# no-op on other runners; macOS and Windows are unsupported (see README).
# scripts/mac/ is kept (and unit-tested) as scaffolding for future macOS work.
runs:
  using: "composite"
  steps:

    - name: "Detect platform"
      if: runner.os == 'Linux'
      id: platform
      shell: bash
      run: |
        # Discriminate the cache by distro+version so a library built on one
        # distro/libc (e.g. musl on Alpine, or a newer glibc) is never restored
        # into an incompatible one. Fall back to a libc tag, then 'unknown'.
        plat=""
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          plat="${ID:-}-${VERSION_ID:-}"
        fi
        if [ -z "$plat" ] || [ "$plat" = "-" ]; then
          if ls /lib/ld-musl-* >/dev/null 2>&1; then plat="musl"; else plat="glibc"; fi
        fi
        # Sanitize to a safe cache-key segment.
        plat="$(printf '%s' "$plat" | tr -c 'A-Za-z0-9._-' '_')"
        echo "tag=$plat" >> "$GITHUB_OUTPUT"
        echo "Platform cache tag: $plat"

    - name: "Resolve action path"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # In container jobs GitHub leaves github.action_path as a host path
        # (/home/runner/work/...) even though the work dir is mounted at /__w,
        # so scripts referenced by that path are "not found" inside the
        # container. Remap the runner work-dir prefix to the mount when the
        # original path doesn't resolve; a no-op on normal (non-container) runs.
        ap="$GITHUB_ACTION_PATH"
        if [ ! -e "$ap/scripts/linux/checksums.sh" ] && \
           [ -e "/__w/${ap#*/work/}/scripts/linux/checksums.sh" ]; then
          ap="/__w/${ap#*/work/}"
        fi
        echo "JEMALLOC_ACTION_PATH=$ap" >> "$GITHUB_ENV"

    - name: "Restore jemalloc"
      if: runner.os == 'Linux'
      id: cache-jemalloc
      uses: actions/cache/restore@v6
      with:
        path: /tmp/libjemalloc.so.2
        key: v8-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.tag }}-jemalloc-${{ inputs.jemalloc-version }}

    - name: "Relocate jemalloc to expected directory"
      if: ${{ runner.os == 'Linux' && steps.cache-jemalloc.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        # Atomic, idempotent install so a second in-job invocation cannot
        # truncate an LD_PRELOAD'd library in place and crash the copy with
        # SIGSEGV (issue #5).
        bash "$JEMALLOC_ACTION_PATH/scripts/linux/relocate.sh" /tmp/libjemalloc.so.2 /usr/local/lib/libjemalloc.so.2

    - name: "Download jemalloc"
      if: ${{ runner.os == 'Linux' && steps.cache-jemalloc.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        curl -fLs https://github.com/jemalloc/jemalloc/releases/download/${{ inputs.jemalloc-version }}/jemalloc-${{ inputs.jemalloc-version }}.tar.bz2 -o jemalloc-${{ inputs.jemalloc-version }}.tar.bz2
        # Verify the download before it is built and LD_PRELOAD'd (issue #13).
        bash "$JEMALLOC_ACTION_PATH/scripts/linux/checksums.sh" \
          jemalloc-${{ inputs.jemalloc-version }}.tar.bz2 \
          "${{ inputs.jemalloc-version }}" \
          "${{ inputs.jemalloc-sha256 }}"
        tar xf jemalloc-${{ inputs.jemalloc-version }}.tar.bz2

    - name: "Configure and install jemalloc"
      if: ${{ runner.os == 'Linux' && steps.cache-jemalloc.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        cd jemalloc-${{ inputs.jemalloc-version }}
        # --with-huge-page-size=$(awk '/Hugepagesize:/ {print $2/1024 "MB"}' /proc/meminfo)
        ./configure
        make -j"$(nproc)"
        # Auto-detect sudo: distro containers run as root, often without sudo.
        if [ "$(id -u)" = "0" ] || ! command -v sudo >/dev/null 2>&1; then SUDO=""; else SUDO="sudo"; fi
        $SUDO make install
        # Stage the built library for the cache-save step below.
        cp /usr/local/lib/libjemalloc.so.2 /tmp/

    - name: "Configure LD_PRELOAD"
      if: runner.os == 'Linux'
      id: config
      shell: bash
      run: |
        lib=/usr/local/lib/libjemalloc.so.2
        echo "LD_PRELOAD=$lib" >> "$GITHUB_ENV"
        echo "library-path=$lib" >> "$GITHUB_OUTPUT"
        echo "ld-preload=$lib" >> "$GITHUB_OUTPUT"
        # Normalize cache-hit to a definite true/false (the restore step leaves
        # it empty on a miss with no restore-keys).
        if [ "${{ steps.cache-jemalloc.outputs.cache-hit }}" = "true" ]; then
          echo "cache-hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "cache-hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: "Save jemalloc"
      uses: actions/cache/save@v6
      if: ${{ runner.os == 'Linux' && steps.cache-jemalloc.outputs.cache-hit != 'true' }}
      with:
        path: /tmp/libjemalloc.so.2
        key: v8-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.tag }}-jemalloc-${{ inputs.jemalloc-version }}

    - name: "Remove download directory"
      if: ${{ runner.os == 'Linux' && steps.cache-jemalloc.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        rm -rf jemalloc-${{ inputs.jemalloc-version }}
        rm -f jemalloc-${{ inputs.jemalloc-version }}.tar.bz2

branding:
  icon: "cpu"
  color: "blue"
